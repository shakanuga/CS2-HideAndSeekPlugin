name: Build and release

# Baut das Plugin und veröffentlicht eine GitHub-Release mit HideAndSeekPlugin.zip.
# Die Version kommt aus ModuleVersion in HideAndSeekPlugin.cs. Bei jedem Push auf
# main wird geprüft, ob es dafür schon eine Release gibt; wenn nicht, wird gebaut
# und veröffentlicht. Der Server-Updater in shakanuga/cs2-modded-server holt sich
# die neue Release dann automatisch.
#
# Neue Version veröffentlichen: ModuleVersion anheben, committen, pushen. Fertig.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version bestimmen
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(grep -oP 'ModuleVersion\s*=>\s*"\K[^"]+' HideAndSeekPlugin.cs)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version gibt es schon, nichts zu tun."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Neue Version $version wird gebaut."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@v4
        if: steps.v.outputs.exists == 'false'
        with:
          dotnet-version: '10.0.x'

      - name: Bauen
        if: steps.v.outputs.exists == 'false'
        run: |
          set -o pipefail
          dotnet build HideAndSeekPlugin.csproj -c Release -o build 2>&1 | tee build.log

      - name: Paket schnüren
        if: steps.v.outputs.exists == 'false'
        run: |
          set -euo pipefail
          mkdir -p pkg/HideAndSeekPlugin
          cp build/HideAndSeekPlugin.dll build/HideAndSeekPlugin.pdb build/HideAndSeekPlugin.deps.json pkg/HideAndSeekPlugin/
          (cd pkg && zip -r ../HideAndSeekPlugin.zip HideAndSeekPlugin)
          unzip -l HideAndSeekPlugin.zip

      - name: Release veröffentlichen
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.version }}" HideAndSeekPlugin.zip \
            --target "${{ github.sha }}" \
            --title "${{ steps.v.outputs.version }}" \
            --generate-notes

      # Build-Log bei Fehlern in den Branch "build-log" legen, damit man es auch ohne
      # Zugriff auf die Actions-Logs lesen kann.
      - name: Build-Log sichern
        if: failure()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          touch build.log
          git checkout --orphan build-log
          git rm -rfq --cached .
          git add -f build.log
          git commit -qm "Build-Log für ${{ steps.v.outputs.version }}"
          git push -f origin build-log
